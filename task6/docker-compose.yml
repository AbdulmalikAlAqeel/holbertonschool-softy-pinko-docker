services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: softy-pinko-proxy:task5
    ports:
      - "80:80"
    depends_on:
      - front-end
      - back-end

  front-end:
    build:
      context: .
      dockerfile: ./softy-pinko-front-end/Dockerfile
    image: softy-pinko-front-end:task5

  back-end:
    build:
      context: ./softy-pinko-back-end
      dockerfile: Dockerfile
    image: softy-pinko-back-end:task5
